name: Kingdom siege validation
on:
  push:
    branches: [feat/kingdom-gates-woodland-20261027]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run model and navigation regression tests
        run: node --test tests/*.test.mjs
      - name: Verify offline bundle generation
        run: python3 scripts/build_offline.py
