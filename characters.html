<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도라가미 · 캐릭터 연구실</title><link rel="stylesheet" href="./src/characters/preview.css"></head><body>
<header><a href="./">← 전장으로</a><h1>캐릭터 연구실</h1><a href="./rig-editor.html">리그 직접 조정 · JSON 내보내기 →</a><p>작은 새싹부터, 나만의 모험가까지.</p></header>
<main><p id="status" role="status">캐릭터를 준비하고 있어요…</p><div id="cards"></div></main>
<template id="card"><article><div class="portrait"><canvas width="640" height="760" aria-label="캐릭터 미리보기"></canvas></div><h2></h2><div class="controls">
<label>동작<select class="state"><option value="idle">대기</option><option value="walk">이동</option><option value="attack">공격</option><option value="hit">피격</option></select></label>
<label>바라보는 방향<select class="facing"><option value="-1">왼쪽</option><option value="1">오른쪽</option></select></label>
<label>장착 방식<select class="mode"><option value="single">손마다 장착</option><option value="both">한 무기를 양손으로</option></select></label>
<label>왼손<select class="left"></select></label><label>오른손<select class="right"></select></label>
<button class="recommended">권장 무기 장착</button><button class="clear">맨손으로</button><p class="loadout" role="status"></p>
</div></article></template><script type="module" src="./src/characters/preview.mjs"></script></body></html>
