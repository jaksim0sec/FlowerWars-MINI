<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2e9d8">
  <title>도라가미 · 첫 번째 전장</title>
  <link rel="icon" type="image/webp" href="./assets/units/gynari-warrior/head_deco.webp">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="도라가미 처음으로"><span class="brand-mark">✿</span><span>도라가미<small>DORAGAMI</small></span></a>
    <div class="chapter"><span class="chapter-dot"></span> 첫 번째 전장<span class="chapter-divider">/</span><span id="unit-count">용사 2</span></div>
  </header>
  <main id="battlefield">
    <canvas id="board" tabindex="0" role="application" aria-label="도라가미 전장. 드래그로 이동, 휠 또는 두 손가락으로 확대. 방향키로 타일 탐색, Enter로 선택, S로 소환 모드, A로 공격 모드."></canvas>
    <div class="field-caption" aria-hidden="true"><span>GYNARI FIELD</span><h1>작은 용사들의<br>첫걸음.</h1><p>잔디와 흙으로 이어진 작은 전장</p></div>
    <div id="loading" role="status">전장을 준비하고 있어요…</div>
    <div class="camera-tools" aria-label="전장 보기">
      <button id="zoom-in" aria-label="확대">+</button><output id="zoom-value" aria-label="확대 비율">100%</output><button id="zoom-out" aria-label="축소">−</button>
      <span class="tool-divider"></span><button id="fit" aria-label="전장 맞춤" title="전장 맞춤">⌖</button>
    </div>
    <div class="field-label"><i></i> 8 × 6 <span>잔디 · 흙</span></div>
  </main>
  <footer class="command-area">
    <p id="notice" role="status" aria-live="polite">전장을 준비하고 있어요…</p>
    <div class="command-bar">
      <div class="selection"><img src="./assets/units/gynari-warrior/head_deco.webp" alt="" class="selection-icon"><div><strong id="selection-name">용사를 선택하세요</strong><small id="selection-detail">용사를 누른 뒤 원하는 칸으로 이동</small></div></div>
      <div class="actions">
        <button id="summon" class="primary" aria-label="개나리용사 소환" aria-pressed="false"><span>＋</span> 소환</button>
        <button id="attack" aria-label="공격" aria-pressed="false" disabled><span>⚔</span> 공격</button>
        <button id="terrain" title="선택한 칸의 지형 변경" hidden>흙으로</button>
        <button id="reset" class="subtle" aria-label="초기화" title="초기화">↺</button>
      </div>
    </div>
    <div class="instructions"><span>드래그로 이동 · 휠 / 두 손가락으로 확대</span><span>선택 → 빈칸 이동 · 공격 → 상대 선택</span></div>
  </footer>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
