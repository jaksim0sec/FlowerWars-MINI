<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2e9d8">
  <title>도라가미 · 첫 번째 전장</title>
  <link rel="icon" type="image/png" href="./assets/units/shield-guard/head_deco_overlay.png">
  <link rel="stylesheet" href="./src/style.css">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./assets/icons/icon-192.png"></head>
<body>
  <header class="masthead">
    <div class="chapter"><a href="./characters.html">캐릭터 연구실</a><span id="unit-count">용사 2</span></div>
  </header>
  <main id="battlefield">
    <canvas id="board" tabindex="0" role="application" aria-label="도라가미 전장. 드래그로 이동, 휠 또는 두 손가락으로 확대. 방향키로 타일 탐색, Enter로 선택, S로 소환 모드, A로 공격 모드."></canvas>
    <div id="loading" role="status">전장을 준비하고 있어요…</div>
    <div class="camera-tools" aria-label="전장 보기">
      <button id="zoom-in" aria-label="확대">+</button><output id="zoom-value" aria-label="확대 비율">100%</output><button id="zoom-out" aria-label="축소">−</button>
      <span class="tool-divider"></span><button id="fit" aria-label="전장 맞춤" title="전장 맞춤">⌖</button>
    </div>
  </main>
  <details id="movement-lab" class="movement-lab">
    <summary>이동 테스트</summary>
    <div class="movement-options">
      <label>상황<select id="movement-scenario"><option value="formation">양군 전투 진형</option><option value="skirmish">A/B 근접 교전</option><option value="crossing">교차·맞대향</option><option value="bottleneck">한 칸 병목</option><option value="obstacles">장애물 우회</option><option value="crowd">대규모 이동</option></select></label>
      <label>개체 수<select id="movement-count"><option value="16">16</option><option value="64" selected>64</option><option value="256">256</option><option value="1000">1,000</option></select></label>
    </div>
    <div class="movement-options"><label>재현 시드<input id="movement-seed" type="number" value="1" min="0" step="1"></label><label class="mirror-toggle"><input id="movement-mirror" type="checkbox"> 좌우 교환</label></div>
    <label class="combat-toggle"><input id="movement-combat" type="checkbox" checked> A/B 교전 <span><b class="team-a">A</b> / <b class="team-b">B</b> · 주변 8칸</span></label>
    <div class="movement-buttons"><button id="movement-setup" disabled>배치</button><button id="movement-start" disabled>동시 이동</button><button id="movement-default">기본 전장</button></div>
    <output id="movement-stats" aria-live="off">배치 → 동시 이동 · 기존 전장 교체</output>
  </details>
  <details id="group-tools" class="group-tools"><summary>소대/분대 배치</summary>
    <div class="movement-options"><label>단위<select id="group-kind"><option value="squad">분대</option><option value="platoon">소대</option></select></label><label>병력<select id="group-size"><option>8</option><option>16</option><option>32</option><option>64</option></select></label></div>
    <div class="movement-options"><label>이름<input id="group-name" placeholder="혼성 분대" maxlength="24"></label><label>진영<select id="group-team"><option>A</option><option>B</option></select></label></div>
    <label>분대 유형<select id="group-type"><option value="mixed">혼성대</option><option value="assault">돌격대</option><option value="defense">철벽대</option><option value="ranged">궁병대</option><option value="mobile">기동대</option><option value="support">지원대</option></select></label>
    <button id="group-place">묶음 배치</button><small id="group-status">0개 부대 등록</small>
  </details>
  <details id="squad-tools" class="squad-tools" hidden><summary>분대 명령</summary>
    <strong id="squad-name"></strong><small id="squad-status"></small>
    <div class="squad-controls">
      <label>명령<select id="squad-command">
        <option value="move">이동</option><option value="advance">진격</option><option value="hold">사수</option><option value="focus">집중 공격</option>
        <option value="rally">집결</option><option value="retreat">후퇴</option><option value="follow">추종</option><option value="wait">대기</option>
      </select></label>
      <label>태세<select id="squad-stance"><option value="aggressive">적극</option><option value="balanced">균형</option><option value="avoid">회피</option></select></label>
      <label>진형<select id="squad-formation"><option value="line">횡대</option><option value="column">종대</option><option value="dense">밀집</option><option value="spread">산개</option></select></label>
    </div>
    <button id="squad-execute">명령 실행</button><small>목표가 필요한 명령은 전장에서 칸이나 상대 분대를 선택하세요.</small>
  </details>
  <details id="field-tools" class="field-tools"><summary>전장 설정</summary>
    <div class="movement-options"><label>가로 칸<input id="board-columns" type="number" min="4" max="256" value="10"></label><label>세로 칸<input id="board-rows" type="number" min="4" max="256" value="16"></label></div>
    <button id="board-resize">크기 적용</button><p>병력·이동 목표를 벗어나는 축소는 제한됩니다.</p>
    <button id="combat-enable">전체 공격 활성</button><button id="combat-disable">공격 중지</button>
  </details>
  <footer class="command-area">
    <p id="notice" role="status" aria-live="polite">전장을 준비하고 있어요…</p>
    <div class="command-bar">
      <div class="selection"><img src="./assets/units/shield-guard/head_deco_overlay.png" alt="" class="selection-icon"><div><strong id="selection-name">용사를 선택하세요</strong><small id="selection-health" aria-live="polite"></small><small id="selection-combat" hidden></small><small id="selection-detail">용사를 누른 뒤 원하는 칸으로 이동</small></div></div>
      <div class="actions"><select id="character-type" aria-label="소환할 캐릭터"><option value="shield-guard">개나리 방패병</option></select>
        <button id="summon" class="primary" aria-label="개나리 방패병 소환" aria-pressed="false"><span>＋</span> 소환</button>
        <button id="attack" aria-label="공격" aria-pressed="false" disabled><span>⚔</span> 공격</button>
        <button id="terrain" title="선택한 칸의 지형 변경" hidden>흙으로</button>
        <button id="reset" class="subtle" aria-label="초기화" title="초기화">↺</button>
      </div>
    </div>
  </footer>
  <script type="module" src="./src/app.mjs"></script>
<script type="module" src="./src/offline.mjs"></script></body>
</html>
